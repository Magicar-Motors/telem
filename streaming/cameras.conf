# Which physical camera becomes which stream.
#
# Ordering used to come from the /dev/video* glob, i.e. USB enumeration order,
# so plugging in a camera renamed the others and a camera that failed to open
# promoted its neighbour into its port. Roles are pinned to ports here instead:
# a missing camera leaves its port dark rather than shifting the rest, and the
# per-camera settings travel with the camera instead of with its slot.
#
# Fields, pipe-separated (by-path names contain colons, so colon is no good):
#
#   role      Name for logs and the OBS source. Also what server/src/http.ts
#             looks up for the /cam/exposure controls (CAM_CONTROL_ROLE).
#   port      SRT port. Fixed per role. 9002 is the audio stream — don't reuse.
#   selector  Glob matched against the /dev/v4l/by-path and /dev/v4l/by-id
#             symlink names for each capture device. A literal /dev/videoN
#             also matches, for bringing something up in a hurry.
#   res       WIDTHxHEIGHT, must be offered by the camera as MJPEG.
#   flip      GStreamer nvvidconv flip-method. 0 = none, 2 = 180 degrees.
#   bitrate   H.264 target in bits/sec. Peak is set to 1.25x this.
#   overlay   yes/no — burn the wall clock into the bottom-left of the frame.
#   controls  Optional v4l2-ctl settings, semicolon-separated, applied a few
#             seconds after the pipeline opens the device.
#
# Prefer by-path selectors: they name the physical USB port, which is bolted
# down in the car, so swapping a dead camera for an identical spare keeps the
# mapping. Use a by-id selector (which carries the unit's serial) for anything
# that moves between ports.
#
# `./detect_cameras.sh` prints a ready-to-paste line for every camera it finds.
# The globs below are placeholders — replace them with real ones from that
# output. Until a row matches something, start_streaming.sh falls back to the
# old enumeration order so the car still streams, and says so loudly.
#
# role|port|selector|res|flip|bitrate|overlay|controls
forward|9000|*usb-0:2.1:*|1920x1080|0|2500000|yes|zoom_absolute=100;exposure_auto=1;exposure_absolute=3;gain=32;backlight_compensation=0;brightness=128
driver|9001|*usb-0:2.3:*|1280x720|2|1200000|no|
rear|9003|*usb-0:2.4:*|1280x720|0|1200000|no|
